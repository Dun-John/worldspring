[workspace]
resolver = "3"
members = ["crates/worldgen", "crates/worldgen-wasm", "crates/mapd"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
libm = "0.2.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
half = { version = "2.7", default-features = false }

# Native release (tests, tools, mapd): fast to compile.
[profile.release]
opt-level = 3

# Shipped WASM: whole-program optimization is worth the slow link.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1

# `npm run wasm -- --quick`: the same code built fast for checking work in progress (no LTO, many
# codegen units, incremental, no wasm-opt). Slower to run and bigger; never published.
[profile.wasm-quick]
inherits = "release"
codegen-units = 256
incremental = true

# `--profile fast`: the release build made quick to rebuild for checking work in progress (incremental, many
# codegen units: ~10 s after a one-line edit, not ~2.5 min; the code runs ~1.7x slower). Same output; vital and
# anything timed run on release.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256

# Generation is too slow unoptimized; keep dev builds usable.
[profile.dev]
opt-level = 2
